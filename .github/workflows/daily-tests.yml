name: Daily Playwright Tests with Allure

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_env:
        description: Target site environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.event.inputs.test_env || 'staging' }}
  cancel-in-progress: false

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.test_env || 'staging' }}
    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      - name: Verify credentials secrets
        env:
          GENKI_TEST_EMAIL: ${{ secrets.GENKI_TEST_EMAIL }}
          GENKI_TEST_PASSWORD: ${{ secrets.GENKI_TEST_PASSWORD }}
        run: |
          echo "TEST_ENV=${TEST_ENV}"
          missing=0
          for name in GENKI_TEST_EMAIL GENKI_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Actions secret::$name is empty for environment '${TEST_ENV}'. Add it under Settings → Environments → ${TEST_ENV} (or repo Actions secrets)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Credential secrets are present for ${TEST_ENV}."

      - name: Run Playwright tests
        run: npx playwright test --project=chrome --grep-invert @email
        continue-on-error: true
        env:
          GENKI_TEST_EMAIL: ${{ secrets.GENKI_TEST_EMAIL }}
          GENKI_TEST_PASSWORD: ${{ secrets.GENKI_TEST_PASSWORD }}
          GENKI_TEST_DISPLAY_NAME: ${{ secrets.GENKI_TEST_DISPLAY_NAME }}

      - name: Check if gh-pages exists
        id: ghpages
        if: always()
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No gh-pages branch yet; Allure history will start on this run."
            mkdir -p gh-pages
          fi

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && steps.ghpages.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: gh-pages

      - name: Strip git metadata from history checkout
        if: always() && steps.ghpages.outputs.exists == 'true'
        run: rm -rf gh-pages/.git

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Prepare GitHub Pages assets
        if: always()
        run: |
          mkdir -p allure-history
          sudo chown -R "$(id -u):$(id -g)" allure-history allure-report 2>/dev/null || true
          rm -rf allure-history/.git
          touch allure-history/.nojekyll
          if [ ! -s allure-history/index.html ]; then
            printf '%s\n' '<!DOCTYPE html><title>Allure</title><p>No Allure report was generated.</p>' > allure-history/index.html
          fi
          echo "Files to publish: $(find allure-history -type f | wc -l)"

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-history
          allow_empty_commit: true
          # Never exclude .git — peaceiris would delete the publish worktree repo.
          exclude_assets: '.github'
